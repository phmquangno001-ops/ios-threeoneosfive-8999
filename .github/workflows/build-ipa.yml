name: Build iOS IPA & Deploy

on:
  workflow_dispatch:
    inputs:
      auto_fix_attempt:
        description: 'Auto-fix attempt counter'
        required: false
        default: '0'
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.3.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Apple Certificate (.p12)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is missing! Please configure secrets."
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD="${KEYCHAIN_PASSWORD:-buildpassword123}"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import Apple Intermediate Certificates for complete trust chain
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/AppleWWDRCAG3.cer 2>/dev/null && security import /tmp/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer -o /tmp/AppleWWDRCAG4.cer 2>/dev/null && security import /tmp/AppleWWDRCAG4.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o /tmp/AppleWWDRCAG6.cer 2>/dev/null && security import /tmp/AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true

          # Import signing certificate
          security import "$CERTIFICATE_PATH" -P "${P12_PASSWORD:-1}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Certificates in keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '".*"' | head -n 1 | tr -d '"' || echo "")
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Discovered Signing Identity: $SIGNING_IDENTITY"
            echo "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          else
            echo "CODE_SIGN_IDENTITY=iPhone Distribution" >> $GITHUB_ENV
          fi
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> $GITHUB_ENV

      - name: Install Provisioning Profile (.mobileprovision)
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 secret is missing! Please configure secrets."
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_RAW=$RUNNER_TEMP/profile.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_RAW"

          UUID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "")
          if [ -z "$UUID" ]; then
            UUID="temp-build-profile"
          fi
          echo "Provisioning Profile UUID: $UUID"
          cp "$PROFILE_RAW" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          cp "$PROFILE_RAW" ~/Library/MobileDevice/Provisioning\ Profiles/default.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV

          TEAM_ID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo "")
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
          echo "Team ID: $TEAM_ID"

          # Detect export method from profile
          METHOD="ad-hoc"
          if security cms -D -i "$PROFILE_RAW" 2>/dev/null | grep -q "<key>ProvisionedDevices</key>"; then
            GET_TASK_ALLOW=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null || echo "false")
            if [ "$GET_TASK_ALLOW" = "true" ]; then
              METHOD="development"
            else
              METHOD="ad-hoc"
            fi
          elif security cms -D -i "$PROFILE_RAW" 2>/dev/null | grep -q "<key>ProvisionsAllDevices</key>"; then
            METHOD="enterprise"
          else
            METHOD="app-store"
          fi
          echo "Detected export method: $METHOD"
          echo "EXPORT_METHOD=$METHOD" >> $GITHUB_ENV

      - name: Auto-Sync Bundle Identifier with Provisioning Profile
        run: |
          echo "=== KIỂM TRA VÀ TỰ ĐỘNG ĐỒNG BỘ BUNDLE IDENTIFIER KHỚP VỚI CHỨNG CHỈ ==="
          PROFILE_RAW=$RUNNER_TEMP/profile.mobileprovision
          
          APP_ID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "")
          echo "Profile Entitlements App ID: $APP_ID"
          
          if [[ "$APP_ID" == *"."* ]]; then
            PROV_BUNDLE_ID="${APP_ID#*.}"
            if [ "$PROV_BUNDLE_ID" != "*" ] && [ -n "$PROV_BUNDLE_ID" ]; then
              echo "Chứng chỉ yêu cầu chính xác Bundle ID: $PROV_BUNDLE_ID"
              echo "TARGET_BUNDLE_ID=$PROV_BUNDLE_ID" >> $GITHUB_ENV
              
              echo "Đang tự động sửa Bundle Identifier trong mã nguồn..."
              find . -name "project.pbxproj" -exec sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $PROV_BUNDLE_ID;/g" {} + 2>/dev/null || true
              find . -name "Info.plist" -exec plutil -replace CFBundleIdentifier -string "$PROV_BUNDLE_ID" {} + 2>/dev/null || true
            else
              echo "Chứng chỉ là Wildcard (*), cho phép build mọi Bundle ID!"
            fi
          fi

      - name: Repair and Validate Xcode Project
        run: |
          echo "=== TỰ ĐỘNG SỬA CHỮA VÀ XÁC THỰC DỰ ÁN XCODE ==="
          # 1. Loại bỏ xcuserdata có thể bị corrupt
          find . -name "xcuserdata" -type d -exec rm -rf {} + 2>/dev/null || true

          # 2. Sửa hoặc tạo contents.xcworkspacedata hợp lệ nếu file rỗng (0 bytes)
          for proj in $(find . -name "*.xcodeproj"); do
            mkdir -p "$proj/project.xcworkspace"
            wsfile="$proj/project.xcworkspace/contents.xcworkspacedata"
            if [ ! -s "$wsfile" ]; then
              echo "Khôi phục $wsfile rỗng..."
              cat << 'EOF' > "$wsfile"
<?xml version="1.0" encoding="UTF-8"?>
<Workspace
   version = "1.0">
   <FileRef
      location = "self:">
   </FileRef>
</Workspace>
EOF
            fi
          done

          # 3. Loại bỏ file plist rỗng (0 byte) gây lỗi NSPropertyListSerialization Code 3840
          find . -path "*.xcodeproj/*" -name "*.plist" -size 0 -exec rm -f {} + 2>/dev/null || true
          find . -path "*.xcworkspace/*" -name "*.plist" -size 0 -exec rm -f {} + 2>/dev/null || true

          # 4. Kiểm tra project.pbxproj và khôi phục nếu rỗng hoặc dính conflict markers
          for pbx in $(find . -name "project.pbxproj"); do
            echo "Kiểm tra file: $pbx"
            if [ ! -s "$pbx" ]; then
              echo "CẢNH BÁO: $pbx bị rỗng! Đang khôi phục từ git history..."
              COMMIT=$(git log -n 5 --diff-filter=AM --format="%H" -- "$pbx" | head -n 1)
              if [ -n "$COMMIT" ]; then
                git checkout "$COMMIT" -- "$pbx"
              fi
            fi

            if grep -q "<<<<<<<" "$pbx" 2>/dev/null; then
              echo "Phát hiện Git conflict markers trong $pbx, đang giải quyết..."
              sed -i '' '/<<<<<<</d' "$pbx"
              sed -i '' '/=======/d' "$pbx"
              sed -i '' '/>>>>>>>/d' "$pbx"
            fi

            plutil -lint "$pbx" || true
          done

      - name: Setup Dependencies (Cocoapods / SPM if needed)
        run: |
          if [ -f "Podfile" ]; then
            echo "Installing CocoaPods..."
            pod install --repo-update || pod install
          fi
          if [ -f "package.json" ]; then
            echo "Node dependencies detected"
            npm ci || npm install
          fi

      - name: Build Archive & Export IPA
        run: |
          mkdir -p build/output

          # Mở khóa keychain trước khi ký
          security unlock-keychain -p "${{ env.KEYCHAIN_PWD }}" "${{ env.KEYCHAIN_PATH }}" || true

          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            BUILD_TARGET="-workspace $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            BUILD_TARGET="-project $PROJECT"
          else
            if [ -d "Payload" ]; then
              echo "Existing Payload found, packing into IPA directly..."
              zip -r build/output/App.ipa Payload
              exit 0
            fi
            echo "::error::No Xcode project found!"
            exit 1
          fi

          # Phát hiện scheme an toàn
          SCHEME="ThreeOneOSFive"
          RAW_LIST=$(xcodebuild $BUILD_TARGET -list -json 2>/dev/null || true)
          DETECTED_SCHEME=$(python3 -c '
import json, sys
try:
    data = json.loads(sys.argv[1])
    schemes = data.get("project", {}).get("schemes", []) or data.get("workspace", {}).get("schemes", [])
    if schemes and len(schemes) > 0:
        print(schemes[0])
except Exception:
    pass
' "$RAW_LIST" 2>/dev/null || echo "")

          if [ -n "$DETECTED_SCHEME" ]; then
            echo "Using detected scheme: $DETECTED_SCHEME"
            SCHEME="$DETECTED_SCHEME"
          else
            SHARED_SCHEME=$(find . -name "*.xcscheme" -exec basename {} .xcscheme \; 2>/dev/null | head -n 1)
            if [ -n "$SHARED_SCHEME" ]; then
              SCHEME="$SHARED_SCHEME"
            fi
          fi

          echo "Archiving with scheme: $SCHEME"
          xcodebuild clean archive \
            $BUILD_TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROVISIONING_PROFILE_UUID }}" \
            DEVELOPMENT_TEAM="${{ env.DEVELOPMENT_TEAM }}" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Đọc Bundle ID thực tế từ archive
          ARCHIVE_BUNDLE_ID=$(plutil -extract ApplicationProperties.CFBundleIdentifier raw build/App.xcarchive/Info.plist 2>/dev/null || echo "${TARGET_BUNDLE_ID:-com.example.app}")
          echo "Archive Bundle ID: $ARCHIVE_BUNDLE_ID"

          # Tạo ExportOptions.plist hợp lệ bằng Python để tránh lỗi cú pháp heredoc
          python3 -c '
import plistlib, os

export_method = os.environ.get("EXPORT_METHOD", "ad-hoc")
team_id = os.environ.get("DEVELOPMENT_TEAM", "")
profile_uuid = os.environ.get("PROVISIONING_PROFILE_UUID", "")
bundle_id = os.environ.get("ARCHIVE_BUNDLE_ID", "")
signing_identity = os.environ.get("CODE_SIGN_IDENTITY", "iPhone Distribution")

plist_data = {
    "method": export_method,
    "signingStyle": "manual",
    "stripSwiftSymbols": True,
    "compileBitcode": False,
    "thinning": "<none>",
    "teamID": team_id,
    "signingCertificate": signing_identity,
    "provisioningProfiles": {
        bundle_id: profile_uuid
    }
}

with open("ExportOptions.plist", "wb") as f:
    plistlib.dump(plist_data, f)
print("ExportOptions.plist created successfully:")
'
          cat ExportOptions.plist

          echo "Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates

          ls -la build/output/
          IPA_FILE=$(find build/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA file found in build/output!"
            exit 1
          fi
          echo "Successfully generated IPA at: $IPA_FILE"
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-build
          path: build/output/*.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          IPA_NAME=$(basename "$IPA_PATH")

          gh release create "$TAG" "$IPA_PATH" \
            --title "iOS Build ${TAG}" \
            --notes "Tự động build thành công bằng IPA AutoBuilder. File đính kèm: ${IPA_NAME}" \
            --latest || true

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_OUTPUT
